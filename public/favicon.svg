<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Connectix">
    <!-- The rounded-square tile is the brand mark from the sidebar (.brand .mark):
         the same violet gradient, at favicon size where a letter would be
         unreadable. The shield-ish inner curve stands for the tunnel mark. -->
    <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8b5cf6"/>
            <stop offset="1" stop-color="#6d28d9"/>
        </linearGradient>
    </defs>

    <rect width="64" height="64" rx="16" fill="url(#g)"/>

    <!-- Three arcs: a connection opening outward, drawn thick enough to survive
         being rendered at 16px in a browser tab. -->
    <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round">
        <path d="M24 40a11 11 0 0 1 0-16" opacity=".55"/>
        <path d="M31 45a17 17 0 0 1 0-26" opacity=".8"/>
    </g>

    <circle cx="40" cy="32" r="5.5" fill="#fff"/>
</svg>
